name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  SERVICE: ${{ vars.GCP_SERVICE_NAME }}
  REPOSITORY: ${{ vars.GCP_ARTIFACT_REPO }}
  SQL_CONNECTION_NAME: ${{ vars.GCP_SQL_CONNECTION_NAME }}
  DB_USER: ${{ vars.GCP_DB_USER }}
  DB_NAME: ${{ vars.GCP_DB_NAME }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${{ github.sha }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" .

      - name: Push image
        run: docker push "$IMAGE"

      - name: Run migrations against Cloud SQL
        run: |
          curl -o cloud-sql-proxy -sSL \
            "https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.1/cloud-sql-proxy.linux.amd64"
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5433 "$SQL_CONNECTION_NAME" &
          PROXY_PID=$!
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5433) >/dev/null 2>&1 && break
            sleep 1
          done

          DB_PASSWORD=$(gcloud secrets versions access latest --secret="${SERVICE}-db-password")
          export DATABASE_URL="postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@127.0.0.1:5433/${DB_NAME}"
          pip install -r requirements.txt
          alembic upgrade head

          kill "$PROXY_PID"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --quiet
